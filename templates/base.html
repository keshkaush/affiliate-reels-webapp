<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Affiliate Reels Automation{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.css">
    <style>
        body { margin-top: 20px; }
        .container { max-width: 960px; }
        .navbar { margin-bottom: 20px; border-bottom: 1px solid #e1e1e1; padding-bottom: 10px; }
        .navbar a { margin-right: 15px; text-decoration: none; }
        .flash-messages {
            list-style: none;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .flash-messages li.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .flash-messages li.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .flash-messages li.info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('list_affiliate_programs') }}">Affiliate Programs</a>
            <a href="{{ url_for('list_product_affiliate_links') }}">Product Links</a>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="flash-messages">
                    {% for category, message in messages %}
                        <li class="{{ category }}">{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
